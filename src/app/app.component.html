@if (isAuthenticated()) {
  <nav class="app-nav">
    <a routerLink="/exams" class="brand">STU</a>
    <div class="links">
      <a routerLink="/exams" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Exams</a>
      <a routerLink="/exams/new" routerLinkActive="active">New exam</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
    </div>
    <div class="user">
      <span class="user-name">{{ currentUser()?.name }}</span>
      <button type="button" class="btn btn-secondary" (click)="onLogout()">Log out</button>
    </div>
  </nav>
}

<router-outlet />

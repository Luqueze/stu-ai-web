@if (isAuthenticated()) {
  <div class="app-shell">
    <aside class="sidebar">
      <a routerLink="/exams" class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">STU</span>
      </a>

      <nav class="nav">
        <a routerLink="/exams" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h5v-5h4v5h5v-9"/></svg>
          <span class="label">Exams</span>
        </a>
        <a routerLink="/exams/new" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="12" y1="9" x2="12" y2="15"/></svg>
          <span class="label">New exam</span>
        </a>
        <a routerLink="/profile" routerLinkActive="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
          <span class="label">Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <span class="avatar">{{ initials() }}</span>
          <div class="who">
            <span class="user-name">{{ currentUser()?.name }}</span>
            <span class="user-role">{{ currentUser()?.role?.toLowerCase() }}</span>
          </div>
        </div>
        <button type="button" class="btn btn-ghost logout-btn" (click)="onLogout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="label">Log out</span>
        </button>
      </div>
    </aside>

    <main class="app-main">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}

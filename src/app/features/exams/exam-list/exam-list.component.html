<div class="page">
  <h1>Exams</h1>

  @if (isLoading()) {
    <p>Loading exams...</p>
  } @else if (errorMessage()) {
    <p class="form-error">{{ errorMessage() }}</p>
  } @else if (exams().length === 0) {
    <p>No exams yet.</p>
  } @else {
    <ul class="exam-list">
      @for (exam of exams(); track exam.id) {
        <li>
          <a [routerLink]="['/exams', exam.id]">
            <span class="theme">{{ exam.theme }}</span>
            <span class="status" [attr.data-status]="exam.status">{{ exam.status }}</span>
          </a>
        </li>
      }
    </ul>
  }
</div>
